name: Publish site to gh-pages

# GitHub Pages serves the site from the gh-pages branch.
# Every push here copies the site files into that branch.
on:
  push:
    branches: ["claude/wonderful-franklin-0xqmq8", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy site into gh-pages
        run: |
          mkdir /tmp/site
          cp -r index.html favicon.ico site.webmanifest css js assets /tmp/site/
          touch /tmp/site/.nojekyll
          # cache-bust: make browsers load the new CSS/JS after each deploy
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" /tmp/site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rq --ignore-unmatch .
          cp -r /tmp/site/. .
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish ${GITHUB_SHA::7}"
          git push origin gh-pages
