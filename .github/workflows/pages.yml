name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/wonderful-franklin-0xqmq8", "main"]
  workflow_dispatch:
  # refresh the built-in copy of the shop data every hour
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare site
        run: |
          mkdir -p /tmp/site
          cp -r index.html favicon.ico site.webmanifest css js assets /tmp/site/
          touch /tmp/site/.nojekyll

      # A copy of the public shop data (Produk + Pengaturan only) so first-time
      # visitors see the shop instantly; the live data still loads right after.
      - name: Snapshot shop data
        run: |
          URL=$(grep -oE 'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec' js/products.js | head -1)
          if [ -n "$URL" ] && curl -sSL --max-time 60 "$URL?action=data" -o /tmp/data.json && python3 -c "import json,sys; d=json.load(open('/tmp/data.json')); sys.exit(0 if d.get('ok') and d.get('produk') else 1)"; then
            python3 -c "import json; d=json.load(open('/tmp/data.json')); open('/tmp/site/js/snapshot.js','w').write('window.__LG_SNAPSHOT=' + json.dumps({'at': d.get('at'), 'produk': d['produk'], 'pengaturan': d.get('pengaturan', [])}, ensure_ascii=False, separators=(',', ':')) + ';')"
            echo "snapshot: $(wc -c < /tmp/site/js/snapshot.js) bytes"
          else
            echo "snapshot skipped (backend unreachable)"
          fi
          # cache-bust: make browsers load the new CSS/JS after each deploy
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" /tmp/site/index.html

      - name: Keep gh-pages branch in sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rq --ignore-unmatch .
          cp -r /tmp/site/. .
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Publish ${GITHUB_SHA::7}" && git push origin gh-pages; fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/site

      # GitHub's artifact listing can lag a few seconds behind the upload;
      # without this pause deploy-pages sometimes reports "No artifacts found".
      - name: Wait for artifact to register
        run: sleep 20

      - id: deployment
        uses: actions/deploy-pages@v4
